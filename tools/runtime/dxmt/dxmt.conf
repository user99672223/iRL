# iRL DXMT config (DXMT_CONFIG_FILE). Rocket League renders at ResX x ResY and MetalFX spatial
# upscales by this factor to the external display's 2560x1440 (also needs DXMT_METALFX_SPATIAL_SWAPCHAIN=1).
# The app rewrites the factor from its "Render resolution" setting:
#   2560x1440 -> MetalFX off (env unset)   1920x1080 -> 1.3333   1600x900 -> 1.6 (default)   1280x720 -> 2.0
d3d11.metalSpatialUpscaleFactor = 1.6
# Hold 60 fps, paced by the external display (CLAUDE.md display target).
d3d11.preferredMaxFrameRate = 60
