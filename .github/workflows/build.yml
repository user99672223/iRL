# iRL's lean build (REPORT.md D5): only the runtime pieces Rocket League needs + iRL's own app.
# Stages live in tools/build/irl-build.sh; each job runs one and caches it on its own inputs.
name: Build iRL IPA

on:
  push:
    branches: [main]
    paths-ignore: ['REPORT.md', 'PINS.md', 'logs/**', 'tools/aot/**', 'tools/shaders/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

env:
  JOBS: 3

jobs:
  plan:
    runs-on: macos-26
    outputs:
      sdk: ${{ steps.sdk.outputs.key }}
      madeira: ${{ steps.pins.outputs.madeira }}
      fex: ${{ steps.pins.outputs.fex }}
      wine: ${{ steps.pins.outputs.wine }}
      dxmt: ${{ steps.pins.outputs.dxmt }}
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 madeira
      - id: sdk
        working-directory: madeira
        run: bash tools/build/ci-input-key.sh
      - id: pins
        run: |
          echo "madeira=$(git rev-parse HEAD:madeira)" >> "$GITHUB_OUTPUT"
          echo "fex=$(git rev-parse HEAD:fex)" >> "$GITHUB_OUTPUT"
          echo "wine=$(git -C madeira rev-parse HEAD:wine)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git -C madeira rev-parse HEAD:dxmt)" >> "$GITHUB_OUTPUT"
      - name: Check scripts and project
        run: |
          for f in tools/build/*.sh; do bash -n "$f"; done
          ruby -ryaml -e 'YAML.load_file("app/project.yml")'
          plutil -lint app/iRL/Info.plist app/iRL/iRL.entitlements

  llvm:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 madeira
      # Same key and paths as Madeira's workflow, so an LLVM build cached by it is reused.
      - id: cache
        uses: actions/cache@v4
        with:
          key: plan19-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.sdk }}-llvm-ios-15.0.7-${{ hashFiles('madeira/tools/build/build-llvm-ios.sh') }}
          path: |
            madeira/toolchains/llvm-ios-build/.madeira-cache.sha256
            madeira/toolchains/llvm-ios-build/lib/*.a
            madeira/toolchains/llvm-ios-build/include
            madeira/toolchains/llvm-project/llvm/include
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build/irl-build.sh deps llvm
      - uses: actions/upload-artifact@v4
        with:
          name: llvm
          path: |
            madeira/toolchains/llvm-ios-build/.madeira-cache.sha256
            madeira/toolchains/llvm-ios-build/lib/*.a
            madeira/toolchains/llvm-ios-build/include
            madeira/toolchains/llvm-project/llvm/include
          include-hidden-files: true
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-llvm, path: logs/, if-no-files-found: ignore, retention-days: 14 }

  fex:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 madeira
      - uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - id: cache
        uses: actions/cache@v4
        with:
          key: irl-fex-${{ needs.plan.outputs.sdk }}-${{ needs.plan.outputs.fex }}-${{ hashFiles('tools/build/irl-build.sh', 'madeira/build/fex-patches/**') }}
          path: |
            fex/build-ios
            !fex/build-ios/**/*.o
            build/fex-pe
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build/irl-build.sh deps fex
      - uses: actions/upload-artifact@v4
        with:
          name: fex
          path: |
            fex/build-ios
            !fex/build-ios/**/*.o
            build/fex-pe
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-fex, path: logs/, if-no-files-found: ignore, retention-days: 14 }

  wine-native:
    needs: [plan, llvm]
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 madeira
      - uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - id: cache
        uses: actions/cache@v4
        with:
          key: irl-native-${{ needs.plan.outputs.sdk }}-${{ needs.plan.outputs.madeira }}-${{ hashFiles('tools/build/irl-build.sh', 'tools/build/make_lean_ntdll.py', 'tools/build/irl_unixlib_stubs.c') }}
          path: |
            madeira/app/Madeira/libwineserver.a
            madeira/app/Madeira/libntdll_unix.a
            madeira/app/Madeira/libwin32u_unix.a
            madeira/app/Madeira/libdxmt_combined.a
            madeira/app/Madeira/libgnutls.a
            madeira/app/Madeira/libnettle.a
            madeira/app/Madeira/libhogweed.a
            madeira/app/Madeira/libgmp.a
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        with: { name: llvm, path: madeira/toolchains }
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build/irl-build.sh deps native
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: |
            madeira/app/Madeira/libwineserver.a
            madeira/app/Madeira/libntdll_unix.a
            madeira/app/Madeira/libwin32u_unix.a
            madeira/app/Madeira/libdxmt_combined.a
            madeira/app/Madeira/libgnutls.a
            madeira/app/Madeira/libnettle.a
            madeira/app/Madeira/libhogweed.a
            madeira/app/Madeira/libgmp.a
          retention-days: 1
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-wine-native, path: logs/, if-no-files-found: ignore, retention-days: 14 }

  wine-pe:
    needs: plan
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init --depth 1 madeira
      - uses: actions/cache@v4
        with:
          key: mingw-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('madeira/tools/build/setup-llvm-mingw.sh') }}
          path: madeira/toolchains/llvm-mingw-*
      - id: cache
        uses: actions/cache@v4
        with:
          key: irl-pe-${{ needs.plan.outputs.sdk }}-${{ needs.plan.outputs.madeira }}-${{ hashFiles('tools/build/irl-build.sh') }}
          path: madeira/app/Madeira/arm64ec-windows
      - if: steps.cache.outputs.cache-hit != 'true'
        run: tools/build/irl-build.sh deps windows
      - uses: actions/upload-artifact@v4
        with: { name: pe, path: madeira/app/Madeira/arm64ec-windows, retention-days: 1 }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-wine-pe, path: logs/, if-no-files-found: ignore, retention-days: 14 }

  app:
    needs: [plan, fex, wine-native, wine-pe]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          git submodule update --init --depth 1 madeira
          git submodule update --init --recursive --depth 1 fex
          rm -rf madeira/app/Madeira/arm64ec-windows   # replaced by the pruned farm from wine-pe
      - uses: actions/download-artifact@v4
        with: { name: fex, path: . }
      - uses: actions/download-artifact@v4
        with: { name: native, path: madeira/app/Madeira }
      - uses: actions/download-artifact@v4
        with: { name: pe, path: madeira/app/Madeira/arm64ec-windows }
      - uses: actions/cache@v4
        with:
          key: vcruntime-${{ hashFiles('madeira/tools/build/prepare-vcruntime.sh') }}
          path: madeira/app/Madeira/x86_64-vcruntime
      - run: tools/build/irl-build.sh deps vcruntime app
      - name: Check the IPA (Release, no debug dylib)
        run: |
          rm -rf /tmp/ipa && mkdir /tmp/ipa && unzip -q dist/iRL.ipa -d /tmp/ipa
          if ls /tmp/ipa/Payload/*.app/*.debug.dylib /tmp/ipa/Payload/*.app/__preview.dylib 2>/dev/null; then
            echo "::error::debug dylib in the IPA"; exit 1
          fi
          ls -l /tmp/ipa/Payload/iRL.app/iRL
          echo "### iRL.ipa" >> "$GITHUB_STEP_SUMMARY"
          echo "$(du -h dist/iRL.ipa | cut -f1), executable $(du -h /tmp/ipa/Payload/iRL.app/iRL | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: iRL-ipa, path: dist/iRL.ipa, if-no-files-found: error, compression-level: 0 }
      - uses: actions/upload-artifact@v4
        with: { name: iRL-dSYM, path: dist/iRL.app.dSYM.zip, if-no-files-found: warn, compression-level: 0 }
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: logs-app, path: logs/, if-no-files-found: ignore, retention-days: 14 }
